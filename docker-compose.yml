version: '3'

services:
  mongodb:
    image: mongo:4.2.15
    container_name: mongo-pwndoc-ng
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - shared_backend
    # No host port needed; containers talk over the Docker network
    # If you want local admin access: 127.0.0.1:27017:27017

  pwndoc-backend:
    build: ./backend
    image: pwndoc/pwndoc-backend:Intrum
    container_name: pwndoc-backend
    restart: always
    environment:
      - DB_SERVER=mongo-pwndoc-ng
      - DB_NAME=pwndoc
      - MONGO_URI=mongodb://mongo-pwndoc-ng:27017/pwndoc
    volumes:
      - ./backend/report-templates:/app/report-templates
      - ./backend/src/config:/app/src/config
      - ./backend/src/lib/custom:/app/src/lib/custom
      - ./backend/backup:/app/backup
    networks:
      - shared_backend
    depends_on:
      - mongodb

  pwndoc-frontend:
    build: ./frontend
    image: pwndoc/pwndoc-frontend:Intrum
    container_name: pwndoc-frontend
    restart: always
    ports:
      - 443:8443
    networks:
      - shared_backend
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://localhost:8443/"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  shared_backend:
    external: true
    name: pwndoc-ng_backend

volumes:
  mongo-data:
    external: true
    name: pwndoc-ng_mongo-data
